spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recommendation}
    username: ${DB_USERNAME:recommendation}
    password: ${DB_PASSWORD:recommendation}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration
